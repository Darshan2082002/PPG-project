; ============================================================
; platformio.ini  –  ESP32-S3 PPG Arrhythmia Inference
; ============================================================
; Target board : ESP32-S3-DevKitC-1 (WROOM-1 module)
; Framework    : Arduino
; TF library   : tflite-micro-arduino-examples (official Google repo)
;
; Flash steps:
;   1. Install PlatformIO (VSCode extension or pip install platformio)
;   2. Open firmware/ folder as a PlatformIO project
;   3. Connect ESP32-S3 via USB-C
;   4. Run:  pio run --target upload
;   5. Open serial monitor: pio device monitor --baud 115200
; ============================================================

[env:esp32s3]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; ── Build flags ────────────────────────────────────────────────────────────────
build_flags =
    -DARDUINO_ESP32S3_DEV
    -DESP32S3
    ; TFLM requires C++14 or later
    -std=c++14
    ; Increase stack size for TFLM (default 8KB is often insufficient)
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=16384
    ; Optimise for size (important for flash-constrained deployment)
    -Os

; ── TFLite for Microcontrollers library ───────────────────────────────────────
; Uses the official tflite-micro Arduino examples package.
; Pinned to a stable commit – update as needed.
lib_deps =
    https://github.com/tensorflow/tflite-micro-arduino-examples#main

; ── Serial monitor ─────────────────────────────────────────────────────────────
monitor_speed   = 115200
monitor_filters = direct   ; raw output (no colour codes)

; ── Upload ─────────────────────────────────────────────────────────────────────
upload_speed    = 921600
; Uncomment if auto-detection fails:
; upload_port   = COM3     ; Windows
; upload_port   = /dev/ttyUSB0  ; Linux

; ── Partition table ────────────────────────────────────────────────────────────
; The default 4MB layout may be too small when TFLM is included.
; Use huge_app layout (3MB app, 1MB SPIFFS) for large firmware.
board_build.partitions = huge_app.csv

; ── Flash mode ─────────────────────────────────────────────────────────────────
board_build.flash_mode = dio

; ── PSRAM (optional but recommended for large tensor arenas) ───────────────────
; Uncomment if your board has PSRAM (many ESP32-S3 modules do):
; board_build.arduino.memory_type = qio_opi
